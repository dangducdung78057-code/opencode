<head>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 — 莫兰迪·浅薄荷绿 + 暖米 === */
      --color-primary:              #7fa89a;   /* 薄荷青灰，主色 */
      --color-primary-soft:         #a8c5b8;   /* 浅薄荷，装饰 */
      --color-primary-deep:         #5a7a70;   /* 深薄荷，标题/重点 */
      --color-primary-container:    #dce9e0;   /* 主色容器 */
      --color-on-primary:           #ffffff;
      --color-accent:               #c9a87c;   /* 暖金棕，点缀 */
      --color-accent-soft:          #e8d5b7;   /* 浅金 */
      --color-rose:                 #c98b8b;   /* 豆沙粉，舞蹈主题 */
      --color-indigo:               #6b7a8f;   /* 灰蓝，民乐主题 */

      /* === 背景 / 表面 — 暖米色系 === */
      --color-background:                 #f7f4ee;  /* 米白底色 */
      --color-surface-container-lowest:   #faf7f1;  /* 最浅 */
      --color-surface:                    #ffffff;  /* 卡片白 */
      --color-surface-container:          #efeae0;  /* 输入框/容器 */
      --color-surface-container-high:     #e5ded0;  /* 较深容器 */
      --color-surface-container-highest:  #d8cfbe;  /* 最深容器 */

      /* === 文字 === */
      --color-on-surface:           #3d3a33;   /* 深暖灰主文字 */
      --color-on-surface-variant:   #7a7568;   /* 次文字 */
      --color-on-surface-soft:      #a39d8e;   /* 最次文字 */

      /* === 功能色 === */
      --color-success:  #6b9e7a;
      --color-error:    #c97b6b;
      --color-warning:  #d4a85a;

      /* === 边框 === */
      --color-outline:          #c8c0ad;
      --color-outline-variant:  #d8d1c0;

      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.625rem;
      --radius-lg:   1rem;
      --radius-xl:   1.5rem;
      --radius-2xl:  2rem;
      --radius-full: 9999px;

      /* === 阴影 === */
      --shadow-card:   0 2px 12px rgba(61,58,51,0.06);
      --shadow-float:  0 12px 32px rgba(61,58,51,0.08);
      --shadow-dialog: 0 28px 60px rgba(61,58,51,0.12);

      /* === 字体 === */
      --font-serif: "Noto Serif SC", "Songti SC", "STSong", serif;
      --font-sans: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* 水彩晕染纹理背景 */
    .watercolor-bg {
      background-image:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(168,197,184,0.35) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 10%, rgba(232,213,183,0.3) 0%, transparent 55%),
        radial-gradient(ellipse 45% 55% at 70% 80%, rgba(201,139,139,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 35% 35% at 10% 75%, rgba(168,197,184,0.2) 0%, transparent 55%);
    }

    .font-serif { font-family: var(--font-serif); }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>
